<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="775" viewBox="0 0 1190 775" role="img"><style><![CDATA[text{font-family:Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#17233c} .tiny{font-size:17px;fill:#4b5563}.sm{font-size:20px}.md{font-size:24px;font-weight:600}.lg{font-size:29px;font-weight:700}.muted{fill:#59667a}.white{fill:white}.bluelabel{fill:#1d4ed8}]]></style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><text x="45" y="58" class="lg" text-anchor="start">H1a / H1b / H1c：三个仍未排除的工作模型</text><text x="45" y="91" class="tiny" text-anchor="start">关键区别不是“谁能显示全屏”，而是谁产生、请求并放置全宽视频。</text><rect x="44" y="140" width="1100" height="154" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="186" class="lg bluelabel" text-anchor="start">H1a</text><text x="185" y="184" class="md" text-anchor="start">DCU 形成宽幅帧</text><text x="185" y="219" class="sm muted" text-anchor="start">ICS 以宽幅视频为主并叠加其他 UI</text><rect x="630" y="235" width="290" height="23" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="920" y="235" width="200" height="23" rx="3" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/><rect x="44" y="329" width="1100" height="154" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="375" class="lg bluelabel" text-anchor="start">H1b</text><text x="185" y="373" class="md" text-anchor="start">DCU 主要供窄幅画面</text><text x="185" y="408" class="sm muted" text-anchor="start">ICS 负责扩展 / 合成最终全屏</text><rect x="630" y="424" width="200" height="23" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="830" y="424" width="290" height="23" rx="3" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/><rect x="44" y="518" width="1100" height="154" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="564" class="lg bluelabel" text-anchor="start">H1c</text><text x="185" y="562" class="md" text-anchor="start">DCU 请求模式，ICS 合成</text><text x="185" y="597" class="sm muted" text-anchor="start">两者以控制消息协商显示布局</text><rect x="630" y="613" width="245" height="23" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="875" y="613" width="245" height="23" rx="3" fill="#fcd34d" stroke="#f59e0b" stroke-width="2"/><text x="55" y="730" class="sm muted" text-anchor="start">示意条不代表真实总线位宽或屏幕比例。决定性实验：同步观察 DCU→ICS 与 ICS→DISP 的 GVIF。</text></svg>