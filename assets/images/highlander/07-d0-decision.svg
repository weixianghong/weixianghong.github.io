<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="680" viewBox="0 0 1190 680" role="img"><style><![CDATA[text{font-family:Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#17233c} .tiny{font-size:17px;fill:#4b5563}.sm{font-size:20px}.md{font-size:24px;font-weight:600}.lg{font-size:29px;font-weight:700}.muted{fill:#59667a}.white{fill:white}.bluelabel{fill:#1d4ed8}]]></style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><text x="45" y="55" class="lg" text-anchor="start">D0：DCU-only 最终验证的有界决策流程</text><text x="45" y="85" class="tiny" text-anchor="start">S0 实车 Service Menu 与 D0-1 TIS 审计已完成；GTS / Techstream 尚未进行。</text><rect x="38" y="158" width="256" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="166" y="201" class="md" text-anchor="middle">D0-1 / TIS 离线审计</text><text x="166" y="254" class="tiny" text-anchor="middle">已完成：未发现显式布局项</text><rect x="343" y="158" width="256" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="471" y="201" class="md" text-anchor="middle">S0 / 实车服务菜单</text><text x="471" y="254" class="tiny" text-anchor="middle">已完成：两页、三项补齐</text><rect x="648" y="158" width="256" height="140" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="776" y="201" class="md" text-anchor="middle">D0-2 / GTS 诊断</text><text x="776" y="254" class="tiny" text-anchor="middle">待 MFC3 到货，只读</text><rect x="953" y="158" width="202" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1054" y="201" class="md" text-anchor="middle">结果判定</text><text x="1054" y="254" class="tiny" text-anchor="middle">找到入口？</text><line x1="296" y1="230" x2="339" y2="230" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><line x1="604" y1="230" x2="644" y2="230" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><line x1="911" y1="230" x2="948" y2="230" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><rect x="81" y="397" width="466" height="140" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="314" y="440" class="md" text-anchor="middle">找到受支持的布局配置/命令</text><text x="314" y="486" class="sm" text-anchor="middle">保留原值 → 可逆 A/B 测试 → 验证 CarPlay</text><rect x="639" y="397" width="468" height="140" rx="14" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/><text x="872" y="440" class="md" text-anchor="middle">未找到可用入口</text><text x="872" y="486" class="sm" text-anchor="middle">记录 No-Go（低成本配置路）→ R-EXT/ODM</text><line x1="1053" y1="304" x2="315" y2="391" stroke="#334155" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow)"/><line x1="1077" y1="304" x2="869" y2="391" stroke="#334155" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow)"/><text x="52" y="618" class="sm muted" text-anchor="start">No-Go 不是“理论上 DCU-only 绝对不可能”；它只结束既定预算内的配置/正常接口解锁探索。</text></svg>