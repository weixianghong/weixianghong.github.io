<text x="660" y="168" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#666666">① 从候选池取距 q 最近的未访问点</text>
<text x="660" y="208" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#666666">② 展开它的邻居，逐一计算距离</text>
<text x="660" y="248" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#666666">③ 候选池只保留最近的 L 个</text>
