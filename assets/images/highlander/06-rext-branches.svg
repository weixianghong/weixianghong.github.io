xt x="217" y="457" class="md" text-anchor="middle">授权 CarPlay/AA 模块</text><text x="217" y="494" class="tiny" text-anchor="middle">厂商 / SDK / MFi 路径</text><rect x="452" y="410" width="290" height="127" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="597" y="457" class="md" text-anchor="middle">自研 / ODM GVIF 板</text><text x="597" y="493" class="tiny" text-anchor="middle">切换、音频、触控控制</text><rect x="807" y="410" width="313" height="127" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="964" y="457" class="md" text-anchor="middle">原车显示 + 故障回退</text><text x="964" y="494" class="tiny" text-anchor="middle">保留原厂功能</text><line x1="390" y1="474" x2="448" y2="474" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><line x1="746" y1="474" x2="803" y2="474" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><text x="54" y="617" class="sm muted" text-anchor="start">共同阻断项：GVIF 代际/时序 · 触控回传路径 · 电话/Siri 音频 · 故障断电直通 · 原厂安全提示</text></svg>