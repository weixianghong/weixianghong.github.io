<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" role="img" aria-labelledby="harness-check-title harness-check-desc">
  <title id="harness-check-title">同样是退出码 0，怎么判断测试结果</title>
  <desc id="harness-check-desc">检查测试报告。目标用例确实执行并通过，就记录通过。没跑到目标用例，就把未验证的状态交回 Agent。</desc>
  <defs>
    <marker id="harness-check-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="art-arrow" d="M0 0L8 4L0 8Z"/></marker>
  </defs>
  <rect class="art-soft" x="180" y="12" width="280" height="60" rx="12"/>
  <rect class="art-box" x="180" y="104" width="280" height="58" rx="12"/>
  <rect class="art-accent" x="20" y="218" width="276" height="74" rx="12"/>
  <rect class="art-warm" x="344" y="218" width="276" height="74" rx="12"/>
  <g text-anchor="middle" font-size="22">
    <text x="320" y="49">测试命令退出码为 0</text>
    <text x="320" y="140">检查测试报告</text>
    <text x="158" y="249">目标用例已执行并通过</text>
    <text x="482" y="249">没跑到目标用例</text>
  </g>
  <g class="art-muted" text-anchor="middle" font-size="17">
    <text x="158" y="275">记录验证通过</text>
    <text x="482" y="275">交回 Agent 排查</text>
  </g>
  <g class="art-line" marker-end="url(#harness-check-arrow)">
    <path d="M320 74V98"/>
    <path d="M320 164V189H158V212"/>
    <path d="M320 164V189H482V212"/>
  </g>
</svg>
