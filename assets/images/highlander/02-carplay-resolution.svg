<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="615" viewBox="0 0 1190 615" role="img"><style><![CDATA[text{font-family:Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#17233c} .tiny{font-size:17px;fill:#4b5563}.sm{font-size:20px}.md{font-size:24px;font-weight:600}.lg{font-size:29px;font-weight:700}.muted{fill:#59667a}.white{fill:white}.bluelabel{fill:#1d4ed8}]]></style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><text x="50" y="55" class="lg" text-anchor="start">CarPlay 分辨率：三组数字属于不同层</text><text x="50" y="92" class="tiny" text-anchor="start">基于 2026-11-24 sysdiagnose 与实车尺量；图不是 LCD 像素测量结果。</text><rect x="55" y="143" width="320" height="175" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="215" y="187" class="md" text-anchor="middle">iOS UI 画布</text><text x="215" y="232" class="lg" text-anchor="middle">972 × 584</text><text x="215" y="269" class="sm muted" text-anchor="middle">仅 Zoom ON 观察到</text><rect x="432" y="143" width="320" height="175" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/><text x="592" y="187" class="md" text-anchor="middle">H.264 编码器</text><text x="592" y="232" class="lg" text-anchor="middle">800 × 480</text><text x="592" y="269" class="sm muted" text-anchor="middle">日志独立确认</text><rect x="809" y="143" width="320" height="175" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="969" y="187" class="md" text-anchor="middle">车上实际窗口</text><text x="969" y="232" class="lg" text-anchor="middle">180 × 110 mm</text><text x="969" y="269" class="sm muted" text-anchor="middle">iPhone 声明 183×109</text><line x1="380" y1="225" x2="425" y2="225" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><line x1="757" y1="225" x2="802" y2="225" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/><rect x="90" y="393" width="1045" height="170" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="128" y="435" class="md" text-anchor="start">容易误读的 1920 × 720 假设</text><text x="128" y="475" class="sm" text-anchor="start">若全屏为 1920×720：800×480 × 1.5 → 1200×720，1200/1920 = 62.5%</text><text x="128" y="512" class="sm muted" text-anchor="start">这与尺量 180/290 = 62.07% 接近，但 LCD 原生像素、缩放者与比例均未证实。</text></svg>