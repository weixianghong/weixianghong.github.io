<!-- Theme: Warm Sand & Terracotta (light + dark via CSS variables) -->
<style>
  :root {
    --bg: #eef1ee;
    --surface: #f8faf8;
    --text: #313b38;
    --muted: #6a746f;
    --border: #dde5e1;
    --border-strong: #cdd8d2;
    --accent: #0e7c74;
    --accent-hover: #0b625b;
    --tag-bg: #e4efeb;
    --tag-fg: #0e7c74;
    --code-bg: #eaefec;
    --code-border: #dbe4df;
    --nav-link: #4b5651;
    --shadow-card: 0 6px 22px rgba(30, 50, 45, 0.08);
    --shadow-fig: 0 2px 10px rgba(30, 50, 45, 0.06);
  }
  [data-theme="dark"] {
    --bg: #0f1214;
    --surface: #16191c;
    --text: #e2e8f0;
    --muted: #9aa4b2;
    --border: #23282d;
    --border-strong: #2e343b;
    --accent: #2dd4bf;
    --accent-hover: #5eead4;
    --tag-bg: #14312d;
    --tag-fg: #5eead4;
    --code-bg: #16191c;
    --code-border: #2a3036;
    --nav-link: #c3ccd6;
    --shadow-card: 0 6px 22px rgba(0, 0, 0, 0.5);
    --shadow-fig: 0 2px 12px rgba(0, 0, 0, 0.45);
  }

  /* Surfaces & text */
  html, body { background-color: var(--bg); }
  body, .page__content { color: var(--text); }
  .masthead { background-color: var(--bg); border-bottom-color: var(--border); }
  .greedy-nav { background: var(--bg); }
  .greedy-nav a { color: var(--nav-link); }
  .greedy-nav a:hover { color: var(--accent); }
  .page__footer { background-color: var(--surface); border-top-color: var(--border); color: var(--muted); }
  .page__footer a { color: var(--muted); }
  .page__title { color: var(--text); }
  .page__title:empty { display: none; }

  /* Text selection — clearly visible in both themes */
  ::selection { background: var(--accent); color: var(--bg); }
  ::-moz-selection { background: var(--accent); color: var(--bg); }

  /* Typography */
  body,
  .page__content,
  .masthead, .greedy-nav,
  h1, h2, h3, h4, h5, h6,
  .page__title, .archive__item-title, .author__name {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  h1, h2, h3, .page__title { letter-spacing: -0.015em; font-weight: 700; }
  .page__content { font-size: 1.05em; line-height: 1.7; }

  /* Links */
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  .page__content a { text-underline-offset: 2px; }
  .page__title a, .archive__item-title a { text-decoration: none; }

  /* Content elements */
  .page__content h2 { border-bottom-color: var(--border); }
  hr { border-top-color: var(--border); }
  blockquote { border-left-color: var(--accent); }
  p > code, a > code, li > code, td > code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
  }
  .page__related { border-top-color: var(--border); }
  .page__share { border-top-color: var(--border); }
  .page__taxonomy-item { border-color: var(--border); }
  .page__comments-form { background: var(--surface); }
  .page__comments-title { border-top-color: var(--border); }

  /* Post figures: consistent, framed, centered */
  .page__content p > img,
  .page__content > img {
    display: block;
    margin: 1.6em auto;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-fig);
  }

  /* Cards — blog listing + content sections share one look */
  .post-card, .card {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
  }
  .post-card:hover, .card:hover {
    box-shadow: var(--shadow-card);
    transform: translateY(-2px);
    border-color: var(--border-strong);
  }
  .post-card { margin-bottom: 2em; padding: 1.15em 1.25em; }
  .card { margin-bottom: 1.5em; padding: 1.15em 1.25em; }

  .post-card__title { margin: 0 0 0.15em; font-size: 1.35em; }
  .post-card__title a { color: inherit; text-decoration: none; }
  .post-card__title a:hover { color: var(--accent); }
  .post-card__meta { color: var(--muted); font-size: 0.85em; margin: 0 0 0.6em; }
  .post-card__tags { margin: 0 0 0.5em; }
  .post-tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-fg);
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.72em;
    font-weight: 600;
    margin-right: 5px;
    margin-bottom: 4px;
  }
  .post-card__excerpt { color: var(--muted); margin: 0; }

  .card > :first-child { margin-top: 0; }
  .card > :last-child { margin-bottom: 0; }

  /* Section / year dividers above cards (Blog, Publications, CV, Misc) */
  .group-title, .pub-year {
    margin: 1.6em 0 0.7em;
    font-size: 1.4em;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--accent);
    border-bottom: none;
  }
  .group-title:first-of-type, .pub-year:first-of-type { margin-top: 0.2em; }

  /* Entry rows (CV) — the entry title is the focal point */
  .entry { padding: 0.85em 0; border-bottom: 1px solid var(--border); }
  .entry:first-of-type { padding-top: 0; }
  .entry:last-child { padding-bottom: 0; border-bottom: 0; }
  .entry__head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75em; flex-wrap: wrap; }
  .entry__title { font-size: 1.05em; font-weight: 600; color: var(--text); line-height: 1.3; }
  .entry__date { color: var(--muted); font-size: 0.82em; white-space: nowrap; flex-shrink: 0; }
  .entry__meta { color: var(--muted); font-size: 0.9em; margin-top: 0.2em; }
  .entry__note { color: var(--muted); font-size: 0.85em; margin-top: 0.3em; }
  .entry__note::before { content: "\21B3  "; opacity: 0.6; }

  /* Simple item rows (Misc, Service) */
  .item { padding: 0.7em 0; border-bottom: 1px solid var(--border); }
  .item:first-of-type { padding-top: 0; }
  .item:last-child { padding-bottom: 0; border-bottom: 0; }
  .item__label { font-weight: 600; color: var(--text); margin-right: 0.4em; }

  /* Pills (labels) and chips (links) */
  .pill-row { margin-top: 0.45em; }
  .pill { display: inline-block; background: var(--tag-bg); color: var(--tag-fg); padding: 2px 10px; border-radius: 999px; font-size: 0.78em; font-weight: 600; margin: 0.2em 0.35em 0 0; }
  .pill--muted { background: transparent; color: var(--muted); border: 1px solid var(--border-strong); }
  .chip { display: inline-block; padding: 1px 10px; margin: 0.2em 0.35em 0 0; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 0.78em; font-weight: 600; color: var(--accent); text-decoration: none; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
  .chip:hover { background: var(--tag-bg); border-color: var(--accent); color: var(--accent-hover); }

  /* Sub-lines under an item (Misc) */
  .item__sub { color: var(--muted); font-size: 0.92em; margin-top: 0.3em; padding-left: 1.1em; }

  /* Publications */
  .pub-card__title { margin: 0 0 0.4em; font-size: 1.2em; font-weight: 700; line-height: 1.35; }
  .pub-card__authors { margin: 0 0 0.25em; font-size: 0.9em; }
  .pub-card__venue { margin: 0 0 0.3em; font-size: 0.88em; color: var(--muted); }
  .pub-card__links { margin: 0.4em 0 0; }
  .pub-oral { color: var(--accent); font-weight: 600; }

  /* Author sidebar */
  .author__avatar img { border-color: var(--border); }
  .author__urls li { color: var(--text); }
  /* Theme's .social-icons .fa is hardcoded black; make generic icons adapt */
  .social-icons .fa { color: var(--muted); }
  .btn--inverse { background-color: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .author__urls { background: var(--surface); border-color: var(--border); }
  .author__urls:after { border-color: var(--surface) transparent; }
  .author__urls:before { border-color: var(--border-strong) transparent; }
  @media (min-width: 1200px) {
    .author__urls { background: transparent; border: 0; }
    .author__urls:after, .author__urls:before { display: none; }
  }

  /* Dark-mode toggle button — always visible, outside the greedy-nav list */
  .masthead__inner-wrap { position: relative; }
  .masthead__inner-wrap > .dark-mode-toggle {
    position: absolute;
    top: 1em;
    right: 1em;
    z-index: 30;
    padding: 0.5rem 0.4rem;
    border: none;
    outline: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.3em;
    line-height: 1;
  }
  .masthead__inner-wrap > .dark-mode-toggle:hover { color: var(--accent); opacity: 1; }
  /* Reserve room so nav links never run under the toggle, and keep the
     greedy-nav overflow (hamburger) button to its left when it appears. */
  .greedy-nav { padding-right: 2.5em; }
  .greedy-nav button:not(.dark-mode-toggle) { right: 2.5em; }
</style>

<!-- Prevent flash of wrong theme. Priority: saved choice > system preference
     > dark by default (when the system expresses no preference). -->
<script>
  (function () {
    var root = document.documentElement;
    var SUN = "☼";   /* light-mode-showing icon shown while in dark mode */
    var MOON = "☾";  /* dark icon shown while in light mode */

    function saved() {
      try { return localStorage.getItem("theme"); } catch (e) { return null; }
    }
    function systemPrefersLight() {
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
    }
    function isDark() {
      return root.getAttribute("data-theme") === "dark";
    }
    function apply(dark) {
      if (dark) { root.setAttribute("data-theme", "dark"); }
      else { root.removeAttribute("data-theme"); }
      var icon = document.getElementById("theme-icon");
      if (icon) { icon.textContent = dark ? SUN : MOON; }
    }

    /* Initial theme: saved choice > system preference > dark by default. */
    var s = saved();
    apply(s === "light" ? false : s === "dark" ? true : !systemPrefersLight());

    /* Toggle, exposed globally so an inline handler could also reach it. */
    function toggleTheme() {
      var next = !isDark();
      apply(next);
      try { localStorage.setItem("theme", next ? "dark" : "light"); } catch (e) {}
    }
    window.toggleTheme = toggleTheme;

    function ready() {
      apply(isDark());  /* sync icon now that #theme-icon exists */
      var btn = document.getElementById("dark-mode-toggle");
      if (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          toggleTheme();
        });
      }
      /* Follow later system changes until the user picks explicitly. */
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var onChange = function (ev) { if (!saved()) { apply(ev.matches); } };
        if (mq.addEventListener) { mq.addEventListener("change", onChange); }
        else if (mq.addListener) { mq.addListener(onChange); }
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", ready);
    } else {
      ready();
    }
  })();
</script>
