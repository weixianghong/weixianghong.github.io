<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="kvgrowth-title kvgrowth-desc"><title id="kvgrowth-title">KV Cache 的追加与读取</title><desc id="kvgrowth-desc">历史 K 和 V 存在缓存中；新位置追加 K、V 并用自己的 Q 读取可见历史。</desc><defs><marker id="kvgrowth-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" class="art-arrow"/></marker></defs><text x="320" y="30" text-anchor="middle" class="" font-size="24">某一层：旧 KV 保留，新 KV 追加</text><text x="36" y="108" text-anchor="middle" class="" font-size="24">K</text><rect x="70" y="72" width="94" height="58" rx="10" class="art-soft"/><text x="117.0" y="109.0" text-anchor="middle" class="" font-size="24">K1</text><rect x="176" y="72" width="94" height="58" rx="10" class="art-soft"/><text x="223.0" y="109.0" text-anchor="middle" class="" font-size="24">K2</text><rect x="282" y="72" width="94" height="58" rx="10" class="art-soft"/><text x="329.0" y="109.0" text-anchor="middle" class="" font-size="24">K3</text><rect x="388" y="72" width="94" height="58" rx="10" class="art-soft"/><text x="435.0" y="109.0" text-anchor="middle" class="" font-size="24">K4</text><rect x="494" y="72" width="122" height="58" rx="10" class="art-accent"/><text x="555.0" y="109.0" text-anchor="middle" class="" font-size="24">新 K</text><text x="36" y="190" text-anchor="middle" class="" font-size="24">V</text><rect x="70" y="154" width="94" height="58" rx="10" class="art-soft"/><text x="117.0" y="191.0" text-anchor="middle" class="" font-size="24">V1</text><rect x="176" y="154" width="94" height="58" rx="10" class="art-soft"/><text x="223.0" y="191.0" text-anchor="middle" class="" font-size="24">V2</text><rect x="282" y="154" width="94" height="58" rx="10" class="art-soft"/><text x="329.0" y="191.0" text-anchor="middle" class="" font-size="24">V3</text><rect x="388" y="154" width="94" height="58" rx="10" class="art-soft"/><text x="435.0" y="191.0" text-anchor="middle" class="" font-size="24">V4</text><rect x="494" y="154" width="122" height="58" rx="10" class="art-accent"/><text x="555.0" y="191.0" text-anchor="middle" class="" font-size="24">新 V</text><rect x="244" y="272" width="152" height="64" rx="10" class="art-accent"/><text x="320.0" y="312.0" text-anchor="middle" class="" font-size="22">新位置的 Q</text><path d="M320 264 L117 224" class="art-line" marker-end="url(#kvgrowth-arrow)"/><path d="M320 264 L223 224" class="art-line" marker-end="url(#kvgrowth-arrow)"/><path d="M320 264 L329 224" class="art-line" marker-end="url(#kvgrowth-arrow)"/><path d="M320 264 L435 224" class="art-line" marker-end="url(#kvgrowth-arrow)"/><path d="M320 264 L555 224" class="art-line" marker-end="url(#kvgrowth-arrow)"/><text x="320" y="382" text-anchor="middle" class="art-muted" font-size="22">旧位置不重算，但仍要被新 Q 读取</text></svg>
