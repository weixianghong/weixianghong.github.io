<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="staticschedule-title staticschedule-desc"><title id="staticschedule-title">静态调度的时间表示意</title><desc id="staticschedule-desc">三颗芯片的计算与通信时间预先安排，后续芯片在计划时间接收数据。时间格不是实际时钟周期。</desc><defs><marker id="staticschedule-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" class="art-arrow"/></marker></defs><text x="320" y="28" text-anchor="middle" class="" font-size="24">在运行之前，安排计算和数据到达</text><text x="374" y="78" text-anchor="middle" class="art-muted" font-size="22">时间 →</text><text x="64" y="138" text-anchor="middle" class="" font-size="22">A 芯片</text><rect x="132" y="106" width="72" height="56" rx="10" class="art-soft"/><rect x="212" y="106" width="72" height="56" rx="10" class="art-soft"/><rect x="292" y="106" width="72" height="56" rx="10" class="art-soft"/><rect x="372" y="106" width="72" height="56" rx="10" class="art-soft"/><rect x="452" y="106" width="72" height="56" rx="10" class="art-soft"/><rect x="532" y="106" width="72" height="56" rx="10" class="art-soft"/><rect x="132" y="106" width="72" height="56" rx="10" class="art-accent"/><text x="168.0" y="142.0" text-anchor="middle" class="" font-size="20">计算</text><rect x="212" y="106" width="72" height="56" rx="10" class="art-accent"/><text x="248.0" y="142.0" text-anchor="middle" class="" font-size="20">计算</text><path d="M284 162 L334 186" class="art-line" marker-end="url(#staticschedule-arrow)"/><text x="64" y="218" text-anchor="middle" class="" font-size="22">B 芯片</text><rect x="132" y="186" width="72" height="56" rx="10" class="art-soft"/><rect x="212" y="186" width="72" height="56" rx="10" class="art-soft"/><rect x="292" y="186" width="72" height="56" rx="10" class="art-soft"/><rect x="372" y="186" width="72" height="56" rx="10" class="art-soft"/><rect x="452" y="186" width="72" height="56" rx="10" class="art-soft"/><rect x="532" y="186" width="72" height="56" rx="10" class="art-soft"/><rect x="212" y="186" width="72" height="56" rx="10" class="art-accent"/><text x="248.0" y="222.0" text-anchor="middle" class="" font-size="20">计算</text><rect x="292" y="186" width="72" height="56" rx="10" class="art-accent"/><text x="328.0" y="222.0" text-anchor="middle" class="" font-size="20">计算</text><path d="M364 242 L414 266" class="art-line" marker-end="url(#staticschedule-arrow)"/><text x="64" y="298" text-anchor="middle" class="" font-size="22">C 芯片</text><rect x="132" y="266" width="72" height="56" rx="10" class="art-soft"/><rect x="212" y="266" width="72" height="56" rx="10" class="art-soft"/><rect x="292" y="266" width="72" height="56" rx="10" class="art-soft"/><rect x="372" y="266" width="72" height="56" rx="10" class="art-soft"/><rect x="452" y="266" width="72" height="56" rx="10" class="art-soft"/><rect x="532" y="266" width="72" height="56" rx="10" class="art-soft"/><rect x="292" y="266" width="72" height="56" rx="10" class="art-accent"/><text x="328.0" y="302.0" text-anchor="middle" class="" font-size="20">计算</text><rect x="372" y="266" width="72" height="56" rx="10" class="art-accent"/><text x="408.0" y="302.0" text-anchor="middle" class="" font-size="20">计算</text><text x="320" y="385" text-anchor="middle" class="art-muted" font-size="22">通信仍有耗时；目标是可预测、可重叠</text></svg>
