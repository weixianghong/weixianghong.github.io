<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="hybrid-title hybrid-desc"><title id="hybrid-title">GPU 与 LPU 的 Attention–FFN 分离</title><desc id="hybrid-desc">GPU 存 KV Cache 并计算 Attention，LPU 的 SRAM 保存 FFN 或 MoE 权重，双方交换激活。</desc><defs><marker id="hybrid-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" class="art-arrow"/></marker></defs><rect x="24" y="50" width="254" height="250" rx="10" class="art-soft"/><rect x="362" y="50" width="254" height="250" rx="10" class="art-accent"/><text x="151" y="93" text-anchor="middle" class="" font-size="24">GPU</text><text x="489" y="93" text-anchor="middle" class="" font-size="24">LPU / LPX</text><rect x="46" y="118" width="210" height="62" rx="10" class="art-box"/><text x="151.0" y="157.0" text-anchor="middle" class="" font-size="24">Attention</text><rect x="384" y="118" width="210" height="62" rx="10" class="art-box"/><text x="489.0" y="157.0" text-anchor="middle" class="" font-size="24">FFN / MoE</text><text x="151" y="230" text-anchor="middle" class="" font-size="24">KV Cache</text><text x="151" y="269" text-anchor="middle" class="art-muted" font-size="20">保留在 HBM</text><text x="489" y="230" text-anchor="middle" class="" font-size="24">权重常驻</text><text x="489" y="269" text-anchor="middle" class="art-muted" font-size="20">片上 SRAM</text><path d="M280 147 L356 147" class="art-line" marker-end="url(#hybrid-arrow)"/><path d="M358 192 L282 192" class="art-line" marker-end="url(#hybrid-arrow)"/><text x="320" y="343" text-anchor="middle" class="" font-size="22">每层传中间激活，而不是整段 KV Cache</text></svg>
