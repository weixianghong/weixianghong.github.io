<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6B6B"/>
  </marker>
  <style>
    .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #333333; }
    .h1 { font: 700 23px Arial, Helvetica, sans-serif; }
    .h2 { font: 700 18px Arial, Helvetica, sans-serif; }
    .body { font: 400 15px Arial, Helvetica, sans-serif; fill: #666666; }
    .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #666666; }
    .formula { font: 700 19px Arial, Helvetica, sans-serif; fill: #333333; }
    .caption { font: 700 16px Arial, Helvetica, sans-serif; fill: #333333; }
  </style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500" y="48" text-anchor="middle" class="title">How One Impression Becomes an Auction Decision</text>
<rect x="35" y="110" width="220" height="170" rx="16" fill="#F1F3F5" stroke="#546E7A" stroke-width="3"/>
<text x="145.0" y="152" text-anchor="middle" class="h1" fill="#546E7A">Eligible Ads</text>
<text x="145.0" y="188" text-anchor="middle" class="body">Campaign A</text>
<text x="145.0" y="210" text-anchor="middle" class="body">Campaign B</text>
<text x="145.0" y="232" text-anchor="middle" class="body">Campaign C</text>
<rect x="305" y="90" width="260" height="120" rx="16" fill="#E6F2FF" stroke="#1565C0" stroke-width="3"/>
<text x="435.0" y="132" text-anchor="middle" class="h1" fill="#1565C0">Pacing</text>
<text x="435.0" y="168" text-anchor="middle" class="body">How aggressively should</text>
<text x="435.0" y="190" text-anchor="middle" class="body">this campaign compete now?</text>
<rect x="305" y="245" width="260" height="120" rx="16" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3"/>
<text x="435.0" y="287" text-anchor="middle" class="h1" fill="#7B1FA2">eCVR Model</text>
<text x="435.0" y="323" text-anchor="middle" class="body">P(optimized action</text>
<text x="435.0" y="345" text-anchor="middle" class="body">| impression, user, ad)</text>
<rect x="305" y="400" width="260" height="120" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="435.0" y="442" text-anchor="middle" class="h1" fill="#2E7D32">User Value</text>
<text x="435.0" y="478" text-anchor="middle" class="body">Quality and expected</text>
<text x="435.0" y="500" text-anchor="middle" class="body">experience adjustments</text>
<line x1="255" y1="195" x2="305" y2="150" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="255" y1="195" x2="305" y2="305" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="255" y1="195" x2="305" y2="460" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="625" y="190" width="330" height="210" rx="18" fill="#FFF8E1" stroke="#F9A825" stroke-width="3"/>
<text x="790" y="235" text-anchor="middle" class="h1" fill="#F57F17">Total Value</text>
<text x="790" y="285" text-anchor="middle" class="formula">Advertiser Value + User Value</text>
<text x="790" y="325" text-anchor="middle" class="body">Advertiser Value ≈ paced bid × eCVR</text>
<text x="790" y="352" text-anchor="middle" class="body">The exact production formula is more complex</text>
<line x1="565" y1="150" x2="625" y2="245" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="565" y1="305" x2="625" y2="295" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="565" y1="460" x2="625" y2="345" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="500" width="280" height="120" rx="16" fill="#FDEBEC" stroke="#C62828" stroke-width="3"/>
<text x="790.0" y="542" text-anchor="middle" class="h1" fill="#C62828">Auction Winner</text>
<text x="790.0" y="578" text-anchor="middle" class="body">Highest total value among</text>
<text x="790.0" y="600" text-anchor="middle" class="body">eligible candidates</text>
<line x1="790" y1="400" x2="790" y2="500" stroke="#6B6B6B" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="665" text-anchor="middle" class="caption">The highest monetary bid does not necessarily win</text>
</svg>