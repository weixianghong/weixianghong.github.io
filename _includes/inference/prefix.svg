<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="prefix-title prefix-desc"><title id="prefix-title">共同前缀复用和中间编辑造成失效</title><desc id="prefix-desc">追加新消息可保留旧前缀；编辑中间历史会使普通全局注意力后续缓存不能直接复用。</desc><defs><marker id="prefix-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" class="art-arrow"/></marker></defs><text x="16" y="32" text-anchor="start" class="" font-size="22">第一次调用</text><rect x="18" y="54" width="190" height="58" rx="10" class="art-soft"/><text x="113.0" y="91.0" text-anchor="middle" class="" font-size="22">固定指令</text><rect x="221" y="54" width="190" height="58" rx="10" class="art-soft"/><text x="316.0" y="91.0" text-anchor="middle" class="" font-size="22">历史消息</text><rect x="424" y="54" width="190" height="58" rx="10" class="art-soft"/><text x="519.0" y="91.0" text-anchor="middle" class="" font-size="22">当前问题</text><text x="16" y="162" text-anchor="start" class="" font-size="22">末尾追加：前面的缓存可复用</text><rect x="18" y="184" width="190" height="58" rx="10" class="art-accent"/><text x="113.0" y="221.0" text-anchor="middle" class="" font-size="22">固定指令</text><rect x="221" y="184" width="190" height="58" rx="10" class="art-accent"/><text x="316.0" y="221.0" text-anchor="middle" class="" font-size="22">历史消息</text><rect x="424" y="184" width="190" height="58" rx="10" class="art-box"/><text x="519.0" y="221.0" text-anchor="middle" class="" font-size="22">新消息</text><text x="16" y="292" text-anchor="start" class="" font-size="22">中间改动：从这里起重新算</text><rect x="18" y="314" width="190" height="58" rx="10" class="art-accent"/><text x="113.0" y="351.0" text-anchor="middle" class="" font-size="22">固定指令</text><rect x="221" y="314" width="190" height="58" rx="10" class="art-warm"/><text x="316.0" y="351.0" text-anchor="middle" class="" font-size="22">历史改了</text><rect x="424" y="314" width="190" height="58" rx="10" class="art-warm"/><text x="519.0" y="351.0" text-anchor="middle" class="" font-size="22">后文重算</text></svg>
