<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 406" role="img" aria-labelledby="waferpipeline-title waferpipeline-desc"><title id="waferpipeline-title">按层分配晶圆与流水线并行</title><desc id="waferpipeline-desc">80层假想模型按20层分配到四片晶圆，只沿边界传激活；不同请求可填满流水线。</desc><defs><marker id="waferpipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" class="art-arrow"/></marker></defs><text x="320" y="30" text-anchor="middle" class="" font-size="24">权重留下，激活往前走</text><rect x="20" y="68" width="130" height="116" rx="10" class="art-accent"/><text x="85" y="110" text-anchor="middle" class="" font-size="22">晶圆 1</text><text x="85" y="151" text-anchor="middle" class="" font-size="20">1–20 层</text><path d="M153 126 L173 126" class="art-line" marker-end="url(#waferpipeline-arrow)"/><rect x="177" y="68" width="130" height="116" rx="10" class="art-accent"/><text x="242" y="110" text-anchor="middle" class="" font-size="22">晶圆 2</text><text x="242" y="151" text-anchor="middle" class="" font-size="20">21–40 层</text><path d="M310 126 L330 126" class="art-line" marker-end="url(#waferpipeline-arrow)"/><rect x="334" y="68" width="130" height="116" rx="10" class="art-accent"/><text x="399" y="110" text-anchor="middle" class="" font-size="22">晶圆 3</text><text x="399" y="151" text-anchor="middle" class="" font-size="20">41–60 层</text><path d="M467 126 L487 126" class="art-line" marker-end="url(#waferpipeline-arrow)"/><rect x="491" y="68" width="130" height="116" rx="10" class="art-accent"/><text x="556" y="110" text-anchor="middle" class="" font-size="22">晶圆 4</text><text x="556" y="151" text-anchor="middle" class="" font-size="20">61–80 层</text><text x="320" y="222" text-anchor="middle" class="art-muted" font-size="22">一次前向：经过三个阶段边界</text><path d="M24 260 L614 260" class="art-line"/><text x="320" y="302" text-anchor="middle" class="" font-size="22">不同请求，可以同时占据不同阶段</text><rect x="20" y="324" width="130" height="54" rx="10" class="art-soft"/><text x="85.0" y="359.0" text-anchor="middle" class="" font-size="22">请求 D</text><rect x="177" y="324" width="130" height="54" rx="10" class="art-soft"/><text x="242.0" y="359.0" text-anchor="middle" class="" font-size="22">请求 C</text><rect x="334" y="324" width="130" height="54" rx="10" class="art-soft"/><text x="399.0" y="359.0" text-anchor="middle" class="" font-size="22">请求 B</text><rect x="491" y="324" width="130" height="54" rx="10" class="art-soft"/><text x="556.0" y="359.0" text-anchor="middle" class="" font-size="22">请求 A</text></svg>
