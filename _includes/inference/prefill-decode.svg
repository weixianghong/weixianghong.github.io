<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="prefilldecode-title prefilldecode-desc"><title id="prefilldecode-title">Prefill、Decode 与 Batching</title><desc id="prefilldecode-desc">输入位置可并行处理；单个请求的输出有依赖，不同请求的下一个位置可一起计算。</desc><defs><marker id="prefilldecode-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" class="art-arrow"/></marker></defs><text x="20" y="30" text-anchor="start" class="" font-size="24">Prefill：已知输入，一起处理</text><rect x="22" y="56" width="58" height="50" rx="10" class="art-accent"/><text x="51.0" y="89.0" text-anchor="middle" class="" font-size="24">读</text><rect x="90" y="56" width="58" height="50" rx="10" class="art-accent"/><text x="119.0" y="89.0" text-anchor="middle" class="" font-size="24">这</text><rect x="158" y="56" width="58" height="50" rx="10" class="art-accent"/><text x="187.0" y="89.0" text-anchor="middle" class="" font-size="24">篇</text><rect x="226" y="56" width="58" height="50" rx="10" class="art-accent"/><text x="255.0" y="89.0" text-anchor="middle" class="" font-size="24">文</text><path d="M302 81 L352 81" class="art-line" marker-end="url(#prefilldecode-arrow)"/><rect x="370" y="52" width="246" height="60" rx="10" class="art-box"/><text x="493.0" y="90.0" text-anchor="middle" class="" font-size="24">共享同一份权重</text><text x="20" y="159" text-anchor="start" class="" font-size="24">Decode：同一请求，逐步推进</text><rect x="22" y="184" width="170" height="60" rx="10" class="art-soft"/><text x="107.0" y="222.0" text-anchor="middle" class="" font-size="22">token 1</text><path d="M196 214 L221 214" class="art-line" marker-end="url(#prefilldecode-arrow)"/><rect x="229" y="184" width="170" height="60" rx="10" class="art-soft"/><text x="314.0" y="222.0" text-anchor="middle" class="" font-size="22">token 2</text><path d="M403 214 L428 214" class="art-line" marker-end="url(#prefilldecode-arrow)"/><rect x="436" y="184" width="170" height="60" rx="10" class="art-soft"/><text x="521.0" y="222.0" text-anchor="middle" class="" font-size="22">token 3</text><text x="20" y="296" text-anchor="start" class="" font-size="24">Batching：不同请求，拼在一起</text><rect x="22" y="320" width="108" height="56" rx="10" class="art-accent"/><text x="76.0" y="356.0" text-anchor="middle" class="" font-size="22">用户 A</text><rect x="142" y="320" width="108" height="56" rx="10" class="art-accent"/><text x="196.0" y="356.0" text-anchor="middle" class="" font-size="22">用户 B</text><rect x="262" y="320" width="108" height="56" rx="10" class="art-accent"/><text x="316.0" y="356.0" text-anchor="middle" class="" font-size="22">用户 C</text><path d="M386 348 L428 348" class="art-line" marker-end="url(#prefilldecode-arrow)"/><rect x="444" y="320" width="172" height="56" rx="10" class="art-box"/><text x="530.0" y="356.0" text-anchor="middle" class="" font-size="22">同一轮计算</text></svg>
