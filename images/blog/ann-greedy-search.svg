<rect x="638" y="366" width="320" height="148" rx="16" fill="#FFF3E0" stroke="#E65100" stroke-width="3"/>
<text x="798" y="404" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E65100">于是全部学问只剩一件事</text>
<text x="798" y="452" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#E65100">边，到底怎么连？</text>
<text x="798" y="487" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#666666">这就是 HNSW / NSG / Vamana 的分野</text>
<text x="500.0" y="560" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333">检索算法三家完全一致；差异全部发生在建图阶段</text>
