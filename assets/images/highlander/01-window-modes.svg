<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="750" viewBox="0 0 1140 750" role="img"><style><![CDATA[text{font-family:Arial,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#17233c} .tiny{font-size:17px;fill:#4b5563}.sm{font-size:20px}.md{font-size:24px;font-weight:600}.lg{font-size:29px;font-weight:700}.muted{fill:#59667a}.white{fill:white}.bluelabel{fill:#1d4ed8}]]></style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><text x="55" y="52" class="lg" text-anchor="start">E0b-1 / E0b-2 ｜ 实车发光区域与显示模式</text><text x="55" y="83" class="tiny" text-anchor="start">实际尺量：总宽 290 mm，CarPlay 180 mm，侧栏约 110 mm；三个模式均为屏幕示意</text><text x="55" y="154" class="md" text-anchor="start">A  CarPlay 左 / Toyota 右</text><rect x="135" y="178" width="540" height="115" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="675" y="178" width="330" height="115" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="405" y="241" class="md white" text-anchor="middle">CarPlay / 主多媒体：180 mm</text><text x="840" y="241" class="md" text-anchor="middle">Toyota：110 mm</text><text x="55" y="347" class="md" text-anchor="start">B  交换左右：尺寸不变</text><rect x="135" y="369" width="330" height="115" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect x="465" y="369" width="540" height="115" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="300" y="432" class="md" text-anchor="middle">Toyota：110 mm</text><text x="735" y="432" class="md white" text-anchor="middle">CarPlay：180 mm</text><text x="55" y="537" class="md" text-anchor="start">C  Trip 可以全屏</text><rect x="135" y="557" width="870" height="115" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="570" y="626" class="md white" text-anchor="middle">Trip Information：290 mm</text><text x="55" y="711" class="sm muted" text-anchor="start">注意：Trip 能全屏 ≠ 已证明 DCU 的 GVIF 帧为全宽；仍缺底层测量。</text></svg>